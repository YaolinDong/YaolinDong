name: Update contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate light and dark contribution animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=%232F81F7
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%2358A6FF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish animations to the output branch
        env:
          GIT_INDEX_FILE: ${{ runner.temp }}/snake-output-${{ github.run_id }}-${{ github.run_attempt }}.index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git read-tree --empty
          git add assets/github-snake.svg assets/github-snake-dark.svg
          tree=$(git write-tree)
          previous=$(git ls-remote origin refs/heads/output | cut -f1)
          if [ -n "$previous" ]; then
            git fetch origin output
            previous=$(git rev-parse FETCH_HEAD)
            if [ "$tree" = "$(git rev-parse "$previous^{tree}")" ]; then
              exit 0
            fi
            commit=$(git commit-tree "$tree" -p "$previous" -m "chore: update contribution snake")
          else
            commit=$(git commit-tree "$tree" -m "chore: update contribution snake")
          fi
          git push origin "$commit:refs/heads/output"
